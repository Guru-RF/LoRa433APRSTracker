; PlatformIO Project Configuration File
;
; RF.Guru LoRa 433 APRS Tracker
; RP2040 with USB Mass Storage for config
;
; One binary drives both board revisions: the RFM95W/SX1276 of V1 and
; the SX1262 module of V2. RadioLib covers both; the chip is identified
; over SPI at boot (see src/radio.cpp).

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem = fatfs
board_build.arduino.earlephilhower.usb_manufacturer = RF.Guru
board_build.arduino.earlephilhower.usb_product = LoRa433APRSTracker
board_build.arduino.earlephilhower.usb_vid = 0x1209
board_build.arduino.earlephilhower.usb_pid = 0xFF42
board_build.filesystem_size = 0.5m
; Float conversions in printf/scanf. The Arduino recipe passes these
; (framework platform.txt, compiler.c.elf.flags); PlatformIO does not,
; so every %f silently printed nothing - the boot banner reported
; "LoRa OK ( MHz" and hid the frequency it had just programmed.
build_flags =
	-Wl,-u,_printf_float
	-Wl,-u,_scanf_float

monitor_speed = 115200
monitor_raw = yes
lib_deps =
	jgromes/RadioLib@7.7.1
	mikalhart/TinyGPSPlus
	adafruit/Adafruit BME680 Library
	adafruit/Adafruit SHTC3 Library
