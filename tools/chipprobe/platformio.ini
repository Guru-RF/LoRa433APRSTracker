; ============================================================
; RF.Guru LoRa hardware diagnostics
;
; Diagnostic firmwares for board bring-up. Only env:radiotest-tx ever
; transmits or enables the PA; the others are strictly passive.
;
;   env:probe     - bare-SPI board bring-up survey. Identifies SX127x vs
;                   SX126x and finds which GPIO carries BUSY / DIO1 /
;                   DIO3 by watching every free pin while the radio is
;                   made to assert them. Use on an unknown board.
;
;   env:radiotest - compiles the production src/radio.cpp and runs the
;                   tracker's real boot path, then reads the settings
;                   back out of the chip. Use to validate a board before
;                   letting the tracker firmware key up.
;
;   env:radiotest-tx - same, plus one on-air frame per boot. Requires an
;                   antenna or dummy load and a callsign you may use.
;
;   env:cwtest    - holds an unmodulated carrier at several PA settings
;                   so a power meter has something steady to read. Same
;                   antenna and licence requirements.
;
; Build + flash:
;   cd tools/chipprobe
;   pio run -e probe
;   picotool load -x .pio/build/probe/firmware.uf2
; ============================================================

[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
board_build.arduino.earlephilhower.usb_manufacturer = RF.Guru
board_build.arduino.earlephilhower.usb_vid = 0x1209
board_build.arduino.earlephilhower.usb_pid = 0xFF43
monitor_speed = 115200
monitor_raw = yes

[env:gpsdump]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
board_build.arduino.earlephilhower.usb_product = LoRaGpsDump
build_src_filter = +<gpsdump/>
build_flags = -I${PROJECT_DIR}/../../include

[env:cwtest]
extends = env:radiotest
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
board_build.arduino.earlephilhower.usb_product = LoRaCwTest
build_src_filter = +<cwtest/> +<../../../src/radio.cpp>
build_flags = -I${PROJECT_DIR}/../../include

[env:probe]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
board_build.arduino.earlephilhower.usb_product = LoRaChipProbe
build_src_filter = +<probe/>

[env:radiotest]
extends = common
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
board_build.arduino.earlephilhower.usb_product = LoRaRadioTest
; config_file.h pulls in FatFS, so the filesystem has to exist here too
board_build.filesystem = fatfs
board_build.filesystem_size = 0.5m
build_src_filter = +<radiotest/> +<../../../src/radio.cpp>
build_flags = -I${PROJECT_DIR}/../../include
lib_deps =
	jgromes/RadioLib@7.7.1
	FatFS
	SPI

[env:radiotest-tx]
extends = env:radiotest
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
board_build.arduino.earlephilhower.usb_product = LoRaRadioTestTX
build_flags = -I${PROJECT_DIR}/../../include -DRADIOTEST_TX
